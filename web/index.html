<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DD-G01 HYPEROBJECT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f1;--panel:#ffffff;--line:#e2e2dc;--ink:#1d1f22;--mute:#6b7078;--acc:#2f6fed;--ok:#2b8a3e;--warn:#e67700;--fail:#c92a2a;--info:#5c7cfa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 'IBM Plex Sans',system-ui,sans-serif;overflow:hidden}
.mono{font-family:'IBM Plex Mono',monospace}
header{height:46px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.02em}
header .sub{color:var(--mute);font-size:12px}
header .sp{flex:1}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b9bcc2}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.on{background:#e8efff;border-color:var(--acc);color:var(--acc)}
main{position:absolute;top:46px;bottom:0;left:0;right:0;display:grid;grid-template-columns:250px 1fr var(--rw,390px)}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
aside.r{border-right:0;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;position:relative}
#rgrip{position:absolute;left:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:5}
#rgrip:hover,#rgrip.on{background:linear-gradient(90deg,transparent 2px,var(--acc) 2px,var(--acc) 4px,transparent 4px)}
body.resizing{cursor:col-resize;user-select:none}
.kpi{cursor:pointer;transition:opacity .15s,filter .15s,box-shadow .15s}
.kpi:hover{box-shadow:0 0 0 1px #b9bcc2}
.kpis.focus .kpi{opacity:.35;filter:grayscale(1)}
.kpis.focus .kpi.sel{opacity:1;filter:none;box-shadow:0 0 0 2px var(--ink)}
.kinfo{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fafaf8}
.kinfo h4{margin:0 0 6px;font-size:12.5px}
.kinfo .code{font-size:11px;color:var(--mute);margin-bottom:8px}
.kinfo .f{font-family:'IBM Plex Mono',monospace;font-size:11.5px;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0}
.kinfo p{margin:4px 0;font-size:12px;color:#3b3f45}
.kinfo .x{float:right;cursor:pointer;color:var(--mute);border:0;background:none;font-size:13px}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
.row{display:flex;align-items:center;gap:6px;margin:4px 0}
.row label{flex:1;color:#3b3f45}
.row input[type=number]{width:72px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;text-align:right}
.row select{padding:3px 5px;border:1px solid var(--line);border-radius:4px;max-width:140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.chk{display:flex;align-items:center;gap:7px;margin:3px 0;cursor:pointer;user-select:none}
.sw{width:11px;height:11px;border-radius:2px;display:inline-block}
#view{position:relative;overflow:hidden}
#view canvas{display:block}
#legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;max-width:520px;display:flex;flex-wrap:wrap;gap:4px 12px}
#legend span{display:flex;align-items:center;gap:5px}
#hud{position:absolute;right:12px;top:12px;display:flex;gap:6px}
#status{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--mute)}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;background:none;padding:10px 7px;font-size:12.5px;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.pane{overflow:auto;padding:12px 14px;flex:1}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kpi b{display:block;font:500 17px 'IBM Plex Mono',monospace}
.kpi small{color:var(--mute);font-size:11px}
.kpi.hv{border-left:3px solid #2f6fed}.kpi.pl{border-left:3px solid #0ca678}.kpi.el{border-left:3px solid #f59f00}.kpi.fp{border-left:3px solid #e03131}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;position:sticky;top:0;background:#fff}
tr.sel td{background:#eef3ff}
tbody tr{cursor:pointer}
.aud{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.aud .t{display:flex;gap:8px;align-items:center;font-weight:500}
.aud p{margin:4px 0 0;color:#3b3f45;font-size:12px}
.aud .ref{color:var(--mute);font-size:11px;margin-top:3px}
.pill{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:10px;color:#fff;font-weight:600}
.pill.ok{background:var(--ok)}.pill.warn{background:var(--warn)}.pill.fail{background:var(--fail)}.pill.info{background:var(--info)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}
.kv div:nth-child(odd){color:var(--mute)}
.kv div:nth-child(even){font-family:'IBM Plex Mono',monospace;word-break:break-word}
ol.miss{padding-left:18px;margin:0}
ol.miss li{margin-bottom:8px}
ol.miss b{display:block}
.note{font-size:11px;color:var(--mute);margin-top:10px}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.cattbl input{width:46px;padding:2px 3px;border:1px solid var(--line);border-radius:3px;text-align:right;font-size:11px}
.cattbl td,.cattbl th{padding:2px 3px}
details summary{cursor:pointer;color:var(--mute);font-size:12px;margin:6px 0}
.trow{display:flex;align-items:center;gap:2px}
.trow .chk{margin:3px 0;flex:1}
.caret{width:16px;flex:none;text-align:center;cursor:pointer;color:var(--mute);font-size:10px;user-select:none;transition:transform .12s}
.caret.open{transform:rotate(90deg)}
.caret.leaf{cursor:default}
.tkids{margin-left:16px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<header>
  <h1>DD-G01 HYPEROBJECT</h1><span class="sub">Hyperobject Media Museum · 260 12th Ave · DD draft v0.5</span>
  <span class="sp"></span>
  <button class="btn" id="bPng">PNG 4K</button>
  <button class="btn" id="bPng8">PNG 8K</button>
  <button class="btn pri" id="b3dm">Rhino .3dm</button>
  <button class="btn" id="bObj">OBJ</button>
  <button class="btn" id="bCsv">CSV</button>
  <button class="btn" id="bJson">JSON</button>
  <a class="btn" href="doc.html" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Doc</a>
</header>
<main>
<aside>
  <div class="sec"><h3>View</h3>
    <div class="grid2"><button class="btn" data-view="iso">Axon</button><button class="btn" data-view="iso2">Axon 2</button><button class="btn" data-view="top">Top</button><button class="btn" data-view="front">Front</button><button class="btn" data-view="side">Side</button><button class="btn" id="bProj">Ortho</button></div>
    <div class="row" style="margin-top:8px"><label>Floor</label><select id="floorSel"></select></div>
    <div class="row"><label>Explode</label><input type="range" id="explode" min="0" max="20" step="0.5" value="0" style="width:120px"></div>
    <div class="row"><label>Context with floor</label><input type="checkbox" id="ctxFloor"></div>
  </div>
  <div class="sec"><h3>Layers</h3>
    <label class="chk"><input type="checkbox" data-layer="shell">Basement / site context</label>
    <label class="chk"><input type="checkbox" data-layer="detail" checked>Cores &amp; restrooms (detail)</label>
    <div class="row" style="margin-left:18px"><label>Wall opacity</label><input type="range" id="wallOp" min="0" max="1" step="0.05" value="0.1" style="width:100px"></div>
    <label class="chk"><input type="checkbox" data-layer="slabs" checked>Slabs</label>
    <div id="treeProgram"></div>
    <div id="treeStructure"></div>
    <label class="chk"><input type="checkbox" data-layer="ghost" checked>Shafts, cores, plant rooms</label>
    <label class="chk"><input type="checkbox" data-layer="labels" checked>Floor labels</label>
    <label class="chk"><input type="checkbox" data-layer="tags" checked>Equipment tags</label>
    <label class="chk"><input type="checkbox" data-layer="outline" checked>Outlines</label>
    <div style="height:6px"></div>
    <label class="chk"><input type="checkbox" data-sys="HVAC" checked><span class="sw" style="background:#2f6fed"></span>HVAC</label>
    <label class="chk"><input type="checkbox" data-sys="Plumbing" checked><span class="sw" style="background:#0ca678"></span>Plumbing</label>
    <label class="chk"><input type="checkbox" data-sys="Electrical" checked><span class="sw" style="background:#f59f00"></span>Electrical</label>
    <label class="chk"><input type="checkbox" data-sys="Fire" checked><span class="sw" style="background:#e03131"></span>Fire protection</label>
    <label class="chk"><input type="checkbox" data-sys="AV" checked><span class="sw" style="background:#e64980"></span>AV / projectors</label>
    <label class="chk"><input type="checkbox" data-sub="Diffuser" checked>Diffusers</label>
    <label class="chk"><input type="checkbox" data-sub="Sprinkler head" checked>Sprinkler heads</label>
  </div>
  <div class="sec"><h3>Design assumptions</h3>
    <div class="row"><label>HVAC concept</label><select data-a="concept"><option value="floorAHU">DOAS + floor AHUs</option><option value="central">Central roof AHUs</option></select></div>
    <div class="row"><label>Generator</label><select data-a="genLocation"><option value="roof">Roof</option><option value="basement">Basement</option></select></div>
    <div id="aInputs"></div>
    <details><summary>Space categories (OLF · Rp · Ra · LPD · EPD)</summary><div id="catTbl"></div></details>
    <button class="btn" id="bReset" style="margin-top:8px;width:100%">Reset to defaults</button>
  </div>
</aside>
<div id="view"><div id="status"></div><div id="hud"><button class="btn" id="bFit">Fit</button><button class="btn" id="bBg">Dark bg</button></div><div id="legend"></div><div id="toast"></div></div>
<aside class="r">
  <div id="rgrip" title="Drag to resize · double-click to reset"></div>
  <div class="tabs" id="tabs"><button data-t="sum" class="on">Summary</button><button data-t="flo">Floors</button><button data-t="eq">Equipment</button><button data-t="aud">Checks</button><button data-t="miss">Next inputs</button><button data-t="ins">Inspector</button></div>
  <div class="pane" id="pane"></div>
</aside>
</main>
<script>window.DATA_DIR = "data/";</script>
<script src="data/project-data.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
